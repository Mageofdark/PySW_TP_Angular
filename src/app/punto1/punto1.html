<div class="container mt-4">
  <h2>Slide de Eventos</h2>
  <div class="card">
    <img [src]="'assets/' + eventos[indiceActual].img" class="card-img-top" [alt]="eventos[indiceActual].nombre">
    <div class="card-body">
      <h5 class="card-title">{{ eventos[indiceActual].nombre }}</h5>
      <p class="card-text">{{ eventos[indiceActual].descripcion }}</p>
    </div>
  </div>
  <div class="d-flex justify-content-between mt-3">
    <button class="btn btn-primary" (click)="anterior()" [disabled]="indiceActual === 0">Anterior</button>
    <button class="btn btn-primary" (click)="siguiente()" [disabled]="indiceActual === eventos.length - 1">Siguiente</button>
  </div>
</div>
