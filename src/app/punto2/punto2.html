<div class="container py-4">

  <!-- Encabezado -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">🛍️ Productos Destacados</h2>

    <button class="btn btn-dark position-relative" (click)="abrirModal()">
      🛒 Carrito
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        {{ totalItems }}
      </span>
    </button>
  </div>

  <!-- Cards -->
  <div class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col" *ngFor="let producto of productos">
      <div class="card h-100 shadow-sm">
        <img [src]="producto.img" class="card-img-top" [alt]="producto.nombre">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ producto.nombre }}</h5>
          <p class="card-text text-muted flex-grow-1">{{ producto.descripcion }}</p>
          <p class="fw-bold text-success fs-5">${{ producto.precio | number:'1.2-2' }}</p>
          <button
            class="btn mt-auto"
            [ngClass]="estaEnCarrito(producto) ? 'btn-secondary' : 'btn-primary'"
            [disabled]="estaEnCarrito(producto)"
            (click)="agregarAlCarrito(producto)">
            {{ estaEnCarrito(producto) ? '✅ Agregado' : '🛒 Agregar al carrito' }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal fade show d-block" tabindex="-1" *ngIf="modalVisible" style="background:rgba(0,0,0,0.5)">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">🛒 Mi Carrito</h5>
          <button type="button" class="btn-close" (click)="cerrarModal()"></button>
        </div>

        <div class="modal-body">

          <!-- Carrito vacío -->
          <div *ngIf="carrito.length === 0" class="text-center text-muted py-4">
            <p>El carrito está vacío.</p>
          </div>

          <!-- Lista estilo imagen -->
          <div *ngFor="let item of carrito" class="d-flex align-items-center border-bottom py-3 gap-3">

            <!-- Imagen -->
            <img [src]="item.producto.img" [alt]="item.producto.nombre"
                 style="width:70px; height:70px; object-fit:cover; border-radius:8px; border:1px solid #ddd">

            <!-- Info -->
            <div class="flex-grow-1">
              <p class="mb-1 fw-semibold">{{ item.producto.nombre }}</p>
              <p class="mb-0 text-muted">${{ item.producto.precio | number:'1.2-2' }}</p>
            </div>

            <!-- Controles cantidad -->
            <div class="d-flex align-items-center gap-2">
              <button class="btn btn-outline-secondary btn-sm" (click)="disminuirCantidad(item)">−</button>
              <span class="fw-bold" style="min-width:24px; text-align:center">{{ item.cantidad }}</span>
              <button class="btn btn-outline-secondary btn-sm" (click)="aumentarCantidad(item)">+</button>
            </div>

          </div>

          <!-- Total -->
          <div *ngIf="carrito.length > 0" class="d-flex justify-content-between align-items-center pt-3">
            <span class="fw-bold fs-5">Total</span>
            <span class="fw-bold fs-5 text-success">${{ total | number:'1.2-2' }}</span>
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn btn-success w-100">✅ Metodos de Pago</button>
          <button class="btn btn-secondary w-100" (click)="cerrarModal()">Cerrar</button>
        </div>

      </div>
    </div>
  </div>

</div>
