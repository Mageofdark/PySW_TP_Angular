<div class="container px-5"> 
    <h2 class="mb-4 text-center"> FORMULARIO </h2>

    <form [formGroup]="form" (ngSubmit)="registrar()" class="row g-3">
        <div class="col-md-4">
            <label for="dni" class="form-label"> DNI </label>
            <input type="number" name="DNI" id="dni" class="form-control" placeholder="Ejemplo: 45100100" formControlName="dni" >
        </div>
        
        <div class="col-md-8">
            <label for="email" class="form-label"> Email </label>
            <input type="email" name="Email" id="email" class="form-control" placeholder="Ejemplo: chispitas67@gmail.com" formControlName="email" >
        </div>

        <!--  Opcion desplegable -->
        <div class="col-md-6">
            <label for="categoriaAlumno" class="form-label"> Categoria alumno </label>
            <select class="form-select" id="categoriaAlumno" formControlName="categoria"
              (change)="calcularPrecio()" >
                <option value="" selected disabled>
                    Seleccione una categoría
                </option>
                <option value="estudiante">Estudiante</option>
                <option value="egresado">Egresado</option>
                <option value="particular">Particular</option>
            </select>
        </div>

        <!-- Opcion desplegable -->
        <div class="col-md-6">
            <label for="curso" class="form-label"> Curso </label>
            <select class="form-select" id="curso" formControlName="curso"
              (change)="calcularPrecio()" >
                <option value="" selected disabled>
                    Seleccione un curso
                </option>
                <option *ngFor="let curso of cursos" [value]="curso.nombre">
                    {{ curso.nombre }}
                </option>
            </select>
        </div>

        <!-- Hacer calculo de precio -->
        <div class="col-md-6" *ngIf="precioFinal > 0">
            <label class="form-label">Precio final</label>
            <input class="form-control" [value]="precioFinal" disabled>
        </div>

        <div>
            <label for="fechaInscripcion" class="form-label" > Fecha inscripcion </label>
            <input type="date" name="Fecha inscripcion" id="fechaInscripcion" class="form-control" formControlName="fecha" >
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary"> Registrar </button>
        </div>
    </form>
</div>
